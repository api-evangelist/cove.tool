note: >-
  cove.tool publishes NO public pricing for the platform or for api.tool. There is no /pricing page
  reachable by a machine, no price on the developer portal, and no plan or credit table in the help
  center. Access is gated on a commercial relationship rather than a published tier: the OpenAPI's
  own getting-started text requires "a valid (trial/licensed) cove.tool account" before any call
  can be made, and the api.tool product page routes to a "Get a Demo" form. Third-party software
  directories (G2, FinancesOnline, aec+tech) all record cove.tool pricing as quote-only.
