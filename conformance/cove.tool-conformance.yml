compliance_certifications:
  published: false
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim was found on any machine-readable cove.tool
    surface, and no trust center exists. probe-security-programs.py returned vdp=none trust=none.
    NO Compliance pointer is wired into apis.yml.
domain_standards_referenced:
  note: >-
    These are standards the cove.tool ANALYSIS ENGINE computes against, surfaced through the API's
    data. They are NOT conformance claims about the HTTP interface, and they are recorded
    separately so they are never counted as API conformance.
  standards:
  - id: energy-codes
    name: Energy codes enumeration
    exposed_via: 'GET /energy-codes (EnergyCodesEnum)'
    note: >-
      The API returns the set of energy codes cove.tool's automated model generation supports, and
      which of them are compatible with a given project. The enumeration is served live rather than
      frozen in the spec, so the authoritative list is the endpoint response.
  - id: sda-ase
    name: Spatial Daylight Autonomy / Annual Sunlight Exposure
    exposed_via: 'GET /analysis/{project_id}'
    note: 'Daylight metrics returned per analysis run, alongside the EUI breakdown.'
  - id: eui
    name: Energy Use Intensity breakdown
    exposed_via: 'project resource (eui, cebcs_eui) and EuiBreakdownHeaders'
    note: >-
      The project schema carries both `eui` and `cebcs_eui`, the latter a CBECS baseline comparison.
      Note the spec's own typo: the property is spelled `cebcs_eui` but the schema's `required`
      list names `cbecs_eui`, so the contract requires a field it never defines.
