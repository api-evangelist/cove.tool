apis:
- aid: cove.tool:rest-api-v2
  name: cove.tool REST API v2
  description: 'The current cove.tool REST API. Thirteen operations across six tags — User,
    Profiles, Energy Codes, Projects, Project Geometry and Daylight Analysis — covering account
    creation, project create/read/update, 3D geometry upload, energy-code lookup, and starting,
    polling, retrieving and stopping daylight/energy analysis runs. Token authentication is sent
    in the Authorization header; tokens are minted at https://app.covetool.com/api/get-token.'
