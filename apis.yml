aid: cove.tool
name: Cove.Tool
description: 'cove.tool (rebranded to "cove" in 2025) is an Atlanta, Georgia building-performance
  analysis platform for architects, engineers and contractors, founded in 2017 by Sandeep Ahuja,
  Patrick Chopson and Daniel Chopson. Its analysis.tool engine runs energy, daylight, glare,
  embodied carbon, water, radiation, shadow and cost-versus-performance optimization on early-stage
  building designs. The company publishes a public REST API — marketed as api.tool — that lets
  software vendors and design firms create projects, upload building geometry, select an energy
  code, kick off daylight and energy simulation, poll job status and retrieve EUI, sDA and ASE
  results without using the web application. Two OpenAPI 3.0 definitions are served from the
  developer portal: a three-operation v1 and a thirteen-operation v2.'
