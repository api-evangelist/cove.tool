    MeshObject:
      description: An array of objects represented as vertex and triangle data. Each mesh must have a
        list of Vertices along with Triangles which refer to Vertices by index. Normal and Center are
        required for each mesh so that the faces are rendered in the correct direction/position. LevelId
        and DerivingElementUniqueId are optional fields
      type: array
      items:
        type: object
        required:
        - Mesh
        - Center
        - Normal
        properties:
          Mesh:
            type: object
            required:
            - Vertices
            - Triangles
            properties:
              Vertices:
                $ref: '#/components/schemas/VerticesObject'
              Triangles:
                $ref: '#/components/schemas/TrianglesArray'
          Center:
            $ref: '#/components/schemas/CenterObject'
          Normal:
            $ref: '#/components/schemas/NormalObject'
    CenterObject:
      allOf:
      - $ref: '#/components/schemas/VerticesModel'
      - type: object
      example:
        X: 72.45084
        Y: 119.337007
        Z: 25.262917
    NormalObject:
