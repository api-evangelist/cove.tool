openapi: 3.0.0
info:
  version: 2.0.0
  title: cove.tool REST API v2
  termsOfService: https://www.cove.tools/terms-of-use
  x-logo:
    url: './covetool_logo.png'
    altText: cove.tool logo
  # description: >-
  #   The cove.tool REST API can be used to upload your project's geometry and
  #   obtain an EUI breakdown. In order to start making calls to the cove.tool
  #   API, obtain an API token (authentication token). Authentication tokens are
  #   used to help identify the user attempting to make the HTTP requests.


  #   By providing an authentication token on every request, it checks whether the
  #   user is authorized and has permission to update and retrieve data.
  
  #   ### Requirements
    
  #   1. **cove.tool account** - Make sure to have access to a valid (trial/licensed) cove.tool account.
  #       - If you do not have a cove.tool account, you can register for one [here](https://app.covetool.com).
    
  #   2. **projects created with cove.tool** - Once you login to your cove.tool account, make sure to create project(s) you wish to update the geometry and obtain an EUI breakdown for! As these are the projects that the API relies on to obtain and retrieve information.
    

  #   ### Pre-requisite Knowledge

  #   It is imperative to take note of the 3 basic objects (**project**, **runs**,
  #   **run values**); how they interact and related with one another when trying
  #   to make updates to project geometry. _An individual project has many runs,
  #   and a run has many run values._


  #   The run represents the data for a given building type/use type. We currently
  #   offer the following use types:
  #     - Office
  #     - Apartments
  #     - Education
  #     - Hospital
  #     - Hotel
  #     - Lab
  #     - Retail
  #     - Single Family Home
  #     - Other
      
  #   ie. A mixed use project with Office, Retail and Apartments would have 3
  #   runs. The _"unique ID"_ is the **url** which must be included when updating
  #   an object.
    
  #   ### Testing
  #     Utilizing standard API testing tools such as [HTTPie](https://httpie.io/) or [Postman](https://www.postman.com/) is a great way to start making calls to the cove.tool API.
    
  #   _Happy Developing!_
  description: |
    # Introduction
    The cove.tool API is a set of HTTP endpoints that help your app integrate with cove.tool. The cove.tool API is developed around the RESTful architecture

    Recently, we released the cove.tool API v2. The cove.tool API v2 includes a modern foundation, new and advanced features to how cove.tool can integrate seamlessly into your app.

    # Getting Started
    In order to start making calls to the API, each request will have to be authenticated. This is done by providing an authentication token on every request. It checks whether the user is authorized and has permission to perform the following actions.  See more in Authentication section.
    1. **Cove.tool account** - Make sure to have access to a valid (trial/licensed) cove.tool account.
    2. **Projects created with cove.tool** - Once you login to your cove.tool account, make sure to create project(s) you wish to start making API requests with! As these are the projects that the API relies on to obtain, update and retrieve information.

    # Authentication
    By providing an authentication token on every request, it checks whether the user is authorized and has permission to update and retrieve data.
      ## Generating an API Token
      | URL | https://app.covetool.com/api/get-token |
      |-----|----------------------------------------|


    # Testing
    In order to understand how the cove.tool API can work for you, the easiest way is to start making requests! We recommend using standard API testing tools such as HTTPie or Postman to start interacting with the API over HTTP.
    
    # Error Codes
    | HTTP Status Code |        Category       |
    |:----------------:|:---------------------:|
    |        200       |           OK          |
    |        201       |        Updated        |
    |        202       |        Accepted       |
    |        400       |      Bad Request      |
    |        401       |  Unauthorized Request |
    |        404       |   Resource Not Found  |
    |        5xx       | Internal Server Error |

    _Happy Developing!_
servers:
  - url: https://app.covetool.com/api/v2
tags:
  - name: User
  - name: Profiles
  - name: Energy Codes
  - name: Projects
  - name: Project Geometry
  - name: Daylight Analysis

paths:
  /auth/signup:
    post:
      tags:
        - User
      summary: Enables the creation of a cove.tool user account
      description: cove.tool accounts can now be created via an API call within your business/organization. This adds a potential new user account to your cove.tool license that are able to access cove.tool products and features.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequests'
        description: User information of a cove.tool account to be created
      responses:
        # OK 
        '201':
          description: Successfully Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupOKResponses'
                # $ref: '#/components/schemas/UserInformation'
        # Bad Request - 400
        '400':
          $ref: '#/components/responses/BadRequest'
  /profiles/{profile_id}:
    get:
      tags:
        - Profiles
      security:
        - apiKeyAuth: []
      summary: Obtain user information
      description: Retrieves the details of a user account within your business/organiation if it exists. If the profile ID does not exist, this call returns an error.
      parameters:
        - in: path
          name: profile_id
          schema:
            type: integer
          required: true
          description: Numeric ID of profile to obtain
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '403':
          description: You do not have permission
        '404':
          description: Resource not found
  /energy-codes:
    get:
      tags:
        - Energy Codes
      security:
        - apiKeyAuth: []
      summary: Enumerates list of energy codes supported by cove.tool or in specific projects
      description: Retrieve a list of available energy codes supported by cove.tool's automated model generation or for a specific project and its compatible energy codes depending on the query parameters passed in.
      
      parameters:
        - in: query
          name: for_project
          description: Specific project number
          example:
            1
          schema:
            type: integer
        - in: query
          name: name
          schema:
            $ref: '#/components/schemas/EnergyCodesEnum'
          example: California
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EnergyCodeForProjectsResponses'
                  - $ref: '#/components/schemas/EnergyCodeResponses'
        '401':
          $ref: '#/components/responses/Unauthorized'
      # description: |
      #   Retrieves a list of supported energy codes within cove.tool
        
      #   When given a project ID, returns all the valid energy codes and the specific energy code selected for the project.
      
      #   Can also filter out all the available energy codes by name by passing in the name query parameter.
  /projects/:
    post:
      tags:
        - Projects
      security:
        - apiKeyAuth: []
      summary: Enables the creation of a new cove.tool project
      description: Skip the 'Create Project' page and create
      requestBody:
        description: "Note: `location` should be in latitude, longitude coordinates"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequestBody'
      responses:
        '201':
          description: Successfully Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
            $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Projects
      security:
        - apiKeyAuth: []
      summary: Retrieves a project's detail and information
      description: Returns a given project ID's detail and information if it exists.
      parameters:
        - in: query
          name: project_id
          schema:
            type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectInfoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}:
    put:
      tags:
        - Projects
      security:
        - apiKeyAuth: []
      summary: Updates a project's detail and information
      parameters:
        - in: path
          required: true
          name: project_id
          schema:
            type: number
      requestBody:
        required: true
        content:  
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequestBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # TODO: WIP
  /projects/{project_id}/geometry:
    post:
      tags:
        - Project Geometry
      security:
        - apiKeyAuth: []
      summary: Updates a project's 3D geometry
      description: Gives you the ability to update a project's 3D geometry that will be utilized to perform Daylight Analysis with analysis.tool.
      
        Updating project geometry requires at least *one* non-zero value in the **wall_area_X**, and **window_area_X** property (where **X** is the cardinal direction).
        
        # List of available cardinal directions (replace **X** with the following acceptable cardinal direction):
        #   - n
        #   - s
        #   - e
        #   - w
        #   - ne
        #   - nw
        #   - se
        #   - sw
        
        # Note that units should be in ft, so areas would be in ft<sup>2</sup> regardless of project units.
        
        # Each category requires an array of objects represented as vertex and triangle data. Note that you can send each category separately. Each mesh must have a list of Vertices along with Triangles which refer to Vertices by inex. Normal and Center are required for each mesh so that the faces are rendered in the correct direction/position. LevelId and DerivingElementUniqueId are optional fields.
      parameters:
        - in: path
          required: true
          name: project_id
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # TODO: Incomplete request body
              $ref: '#/components/schemas/Update3DGeometryRequestBody'
              # # TODO: Development
              # $ref: '#/components/schemas/RoomsMeshObject'
      responses:
        '201':
          description: Successfully Created
          content:
            application/json:
              schema:
                # $ref: '#/components/schemas/Update3DGeometryResponses'
                $ref: '#/components/schemas/UpdateGeometryAreasResponses'
        '400':
          $ref: '#/components/responses/BadRequest'
  /analysis:
    post:
      tags:
        - Daylight Analysis
      security:
        - apiKeyAuth: []
      summary: Kickstarts all analysis types for a given project
      description: Fires off the daylight analysis calculations to start running for a given project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDaylightAnalysisRequestBody'
      responses:
        '202':
          description: "Accepted"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDaylightAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /analysis/{project_id}:
    get:
      tags:
        - Daylight Analysis
      security:
        - apiKeyAuth: []
      summary: Retrieves the results for daylight analysis for a given project
      parameters:
        - in: path
          required: true
          name: project_id
          schema:
            type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaylightAnalysisResultsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /analysis/{project_id}/status:
    get:
      tags:
        - Daylight Analysis
      security:
        - apiKeyAuth: []
      summary: Obtains the remaining number of jobs per analysis type for a given project
      parameters:
        - in: path
          required: true
          name: project_id
          schema:
            type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaylightAnalysisStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
  /analysis/{project_id}/stop:
    get:
      tags:
        - Daylight Analysis
      security:
        - apiKeyAuth: []
      summary: Halts all analyses calculations for a given project
      parameters:
        - in: path
          required: true
          name: project_id
          schema:
            type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopDaylightAnalysisResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  responses:
    OK:
      # 200
      description: Success
    Created:
      # 201
      description: Successfully created
    BadRequest:
      # 400
      description: Invalid request. Check contents of your response body.
    NotFound:
      # 404
      description: The specified resource was not found. Verify if the URI is accurate.
    Unauthorized:
      # 401
      description: Unauthorized request. Check your API token if it is valid.
    InternalServerError:
      # 500
      description: Internal Server Error. Try again later.
  schemas:
    GeneralEndpointResponses:
      type: object
      required:
        - data
        - msg
        - errors
      properties:
        data:
          type: object
        msg:
          type: string
        errors:
          type: array
          items:
            type: string
    # ================== /auth/signup =============================
    UserSignupOKResponses:
      type: object
      allOf:
        - $ref: '#/components/schemas/GeneralEndpointResponses'
        - type: object
      properties:
        data:
          $ref: '#/components/schemas/UserInformationResponseData'
      example:
        data:
          is_owner: false
          is_admin: false
          created_at: "2022-01-28T12:00:47.649935-05:00"
          email: user@company.com
          first_name: John
          last_name: Smith
          business: 
            name: My Company Name
            telephone: 123-456-7890
            user_limit: 10
            domain: mycompanywebsite.com
            size: null
        msg: A new user-profile was created. Activate via email.
        error: []
    UserSignupRequests:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email: 
          type: string
          format: email
          example: hello@covetool.com
        password:
          type: string
          format: password
          example: mysupersecurepassword
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Smith
    # ================== /profiles/{profile_id} =============================
    # Schema/Model
    UserInformationResponseData:
      type: object
      required:
        - is_owner
        - is_admin
        - created_at
        - email
        - first_name
        - last_name
        - business
      properties:
        is_owner:
          type: boolean
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        email:  
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        business:
          type: object
          properties:
            name:
              type: string
            telephone:
              type: number
            user_limit:
              type: number
            domain:
              type: string
              format: url
            size:
              type: number
    UserProfileResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/GeneralEndpointResponses'
      properties:
        data:
          $ref: '#/components/schemas/UserInformationResponseData'
      example:
        data: 
          is_owner: true
          is_admin: false
          created_at: "2022-01-28T12:00:47.649935-05:00"
          email: user@covetool.com
          first_name: John
          last_name: Smith
          business:
            name: Cove Tool
            telephone: 770-777-7777
            user_limit: 10
            domain: covetool.com
            size: null
        msg: "Successfully retrieved resource"
        errors: {}
    # TODO: User associated business
    # ================== /energy-codes/ =============================
    EnergyCodesEnum:
      type: string
      description: Energy code names
      nullable: true
      enum:
        - ASHRAE
        - California
